[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "btcbook"
version = "0.1.0"
description = "Ten-second BTC direction prediction from limit order book state"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "lightgbm>=4.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "websockets>=13",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
btcbook-train = "btcbook.train:main"
btcbook-live = "btcbook.live:main"
btcbook-eval = "btcbook.evaluate:main"

[tool.hatch.build.targets.wheel]
packages = ["src/btcbook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
